apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner-helm-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-cache
  namespace: gitlab-runner-helm-1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: cyclops-fs
  volumeMode: Filesystem
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-helm-1-job
  namespace: gitlab-runner-helm-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-helm-1-job
rules:
- apiGroups:
  - ''
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-helm-1-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-helm-1-job
subjects:
- kind: ServiceAccount
  name: gitlab-runner-helm-1-job
  namespace: gitlab-runner-helm-1
