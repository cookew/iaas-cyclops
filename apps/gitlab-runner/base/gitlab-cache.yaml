apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-cache
  namespace: gitlab-runner-helm-1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: cyclops-fs
  volumeMode: Filesystem
