apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitlab-runner

resources:
- base/gitlab-cache.yaml
- base/namespace.yaml
- sealed-secrets/gitlab-runner-token.yaml

# https://gitlab.com/gitlab-org/charts/gitlab-runner/-/blob/main/Chart.yaml?ref_type=heads
helmCharts:
- includeCRDs: true
  name: gitlab-runner
  namespace: gitlab-runner
  releaseName: gitlab-runner
  repo: https://charts.gitlab.io
  version: 0.91.0
  valuesFile: values.yaml
