# https://github.com/strimzi/strimzi-kafka-operator/blob/1.1.0/examples/user/kafka-user.yaml

apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: tempo
  labels:
    strimzi.io/cluster: tempo
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: tempo
        patternType: literal
      operations:
      - Describe
      - Read
      host: "*"
    - resource:
        type: group
        name: tempo
        patternType: literal
      operations:
      - Read
      host: "*"
    - resource:
        type: topic
        name: tempo
        patternType: literal
      operations:
      - Create
      - Describe
      - Write
      host: "*"
---
# https://github.com/strimzi/strimzi-kafka-operator/blob/1.1.0/examples/topic/kafka-topic.yaml

apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: tempo-traces
  labels:
    strimzi.io/cluster: tempo
spec:
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
  partitions: 1
  replicas: 1
