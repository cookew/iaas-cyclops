# https://headlamp.dev/docs/latest/installation/in-cluster/
# https://github.com/kubernetes-sigs/headlamp/blob/main/charts/headlamp/values.yaml

replicaCount: 1

config:
  inCluster: true
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc-client
    meUserInfoURL: https://keycloak.apps.iaas.wcooke.me/realms/iaas/protocol/openid-connect/userinfo
  watchPlugins: true

env:
- name: OIDC_CLIENT_ID
  value: kubernetes
- name: OIDC_ISSUER_URL
  value: https://keycloak.apps.iaas.wcooke.me/realms/iaas
- name: OIDC_SCOPES
  value: profile
# - name: OIDC_USE_PKCE
#   value: "true"
- name: HEADLAMP_CONFIG_OIDC_CA_FILE
  value: /certs/ca-bundle.pem
# - name: HEADLAMP_CONFIG_ME_USERNAME_PATH
#   value: sub
# - name: OIDC_CALLBACK_URL
#   value: https://headlamp.apps.iaas.wcooke.me/oidc-callback

volumeMounts:
- mountPath: /certs
  name: ca-certificates
  readOnly: true

volumes:
- name: ca-certificates
  configMap:
    name: tm-ca-bundle

persistentVolumeClaim:
  enabled: true
  accessModes:
  - ReadWriteMany
  size: 10Gi
  storageClassName: ceph-filesystem
  volumeMode: Filesystem

ingress:
  annotations:
    cert-manager.io/cluster-issuer: iaas-wcooke-me
    forecastle.stakater.com/appName: Headlamp
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: Kubernetes
    forecastle.stakater.com/icon: https://headlamp.apps.iaas.wcooke.me/apple-touch-icon.png
    forecastle.stakater.com/network-restricted: "true"
  enabled: true
  hosts:
  - host: headlamp.apps.iaas.wcooke.me
    paths:
    - path: /
      type: Prefix
  ingressClassName: cilium
  tls:
  - hosts:
      - headlamp.apps.iaas.wcooke.me
    secretName: chart-example-tls

pluginsManager:
  enabled: true
  configContent:  |
    plugins:
    - name: cert-manager
      source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
      version: 0.1.0
    - name: kubevirt
      source: https://artifacthub.io/packages/headlamp/headlamp-buttahtoast-plugins/buttah_kubevirt
      version: 0.0.1-beta7
    - name: ai-assistant
      source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
      version: 0.2.0-alpha
    - name: envoy-gateway
      source: https://artifacthub.io/packages/headlamp/headlamp-envoy-gateway/envoy-gateway
      version: 0.3.0
    - name: gatekeeper
      source: https://artifacthub.io/packages/headlamp/gatekeeper-headlamp-plugin/gatekeeper
      version: 0.2.0
    - name: kubescape
      source: https://artifacthub.io/packages/headlamp/kubescape-headlamp-plugin/headlamp_kubescape
      version: 0.10.6
    - name: opencost
      source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_opencost
      version: 0.1.3
    - name: trivy
      source: https://artifacthub.io/packages/headlamp/headlamp-trivy/headlamp_trivy
      version: 0.3.1
    - name: crossplane-explorer
      source: https://artifacthub.io/packages/headlamp/crossplane-explorer-headlamp/crossplane-explorer-plugin
      version: 0.1.0
    - name: keda
      source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
      version: 0.1.1-beta
    - name: knative
      source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_knative
      version: 0.2.0-alpha
    # - name: rook
    #   source: https://artifacthub.io/packages/headlamp/headlamp-rook/headlamp-rook-plugin
    #   version: 1.0.0
    - name: strimzi
      source: https://artifacthub.io/packages/headlamp/strimzi-headlamp/headlamp_strimzi
      version: 0.3.9
    # - name: sealed-secrets
    #   source: https://artifacthub.io/packages/headlamp/headlamp-sealed-secrets/headlamp-sealed-secrets
    #   version: 0.24.1
    - name: istio
      source: https://artifacthub.io/packages/headlamp/headlamp-istio-plugin/headlamp_istio
      version: 0.2.0
    - name: crossview
      source: https://artifacthub.io/packages/headlamp/crossview-headlamp/crossview-headlamp
      version: 0.1.4
    installOptions:
      parallel: true
      maxConcurrent: 2
