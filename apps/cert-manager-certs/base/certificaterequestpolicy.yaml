# https://cert-manager.io/docs/policy/approval/approver-policy/#allowed
# https://github.com/cert-manager/approver-policy/blob/main/docs/examples/all-options.yaml

apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: iaas-wcooke-me
spec:
  allowed:
    commonName:
      value: "*"
    dnsNames:
      required: false
      values:
      # Kubernetes specific domains
      - "*.svc.cluster.local"
      - "*.svc.cluster"
      - "*.svc"
      # Exposed domains from Kubernetes
      - "*.wcooke.me"
      # Application specific domains
      - keycloak
      - keycloak-service
      - kube-prometheus-stack-kube-prometheus-operator
      - kube-prometheus-stack-kube-prometheus-operator-webhook
      - mattermost
      - rook-ceph-rgw-ceph-objectstore.rook-ceph-cluster
      - rook-ceph-rgw-ceph-objectstore
      - "*.hubble-relay.cilium.io"
      - "*.default.hubble-grpc.cilium.io"
      - ""
    isCA: false
    usages:
    - client auth
    - digital signature
    - key encipherment
    - server auth
  constraints:
    minDuration: 1h
    maxDuration: 2160h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: iaas-wcooke-me
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: iaas-wcooke-me-namespaced
spec:
  allowed:
    commonName:
      required: false
      value: "*"
    dnsNames:
      required: false
      values:
      - "*"
    isCA: true
    usages:
    - any
    - cert sign
    - client auth
    - code signing
    - content commitment
    - crl sign
    - data encipherment
    - decipher only
    - digital signature
    - email protection
    - encipher only
    - ipsec end system
    - ipsec tunnel
    - ipsec user
    - key agreement
    - key encipherment
    - microsoft sgc
    - netscape sgc
    - ocsp signing
    - s/mime
    - server auth
    - signing
    - timestamping
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
# ---
# # https://github.com/cert-manager/approver-policy/blob/main/docs/examples/default-deny-all.yaml

