---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-policy:iaas-wcooke-me
rules:
- apiGroups:
  - policy.cert-manager.io
  resources:
  - certificaterequestpolicies
  resourceNames:
  - iaas-wcooke-me
  - iaas-wcooke-me-cnpg-issuer
  - cyclops-k8s-issuer
  # - default-deny-all
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-policy:iaas-wcooke-me
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-policy:iaas-wcooke-me
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
