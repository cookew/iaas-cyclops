# https://cert-manager.io/docs/policy/approval/approver-policy/#allowed
# https://github.com/cert-manager/approver-policy/blob/main/docs/examples/all-options.yaml

apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: iaas-wcooke-me
spec:
  allowed:
    commonName:
      value: "*"
    dnsNames:
      required: false
      values:
      # Exposed domains from Kubernetes
      - "*.wcooke.me"
      # Kubernetes specific domains
      - "*.svc.cluster.local"
      - "*.svc.cluster"
      - "*.svc"
      # Cyclops Application specific domains
      - mattermost
      - keycloak
      - keycloak-service
      - kube-prometheus-stack-kube-prometheus-operator
      - kube-prometheus-stack-kube-prometheus-operator-webhook
      # Cluster application specific domains
      - "*.hubble-relay.cilium.io"
      - "*.default.hubble-grpc.cilium.io"
      - rook-ceph-rgw-ceph-objectstore.rook-ceph-cluster
      - rook-ceph-rgw-ceph-objectstore
      - "" # Harber does not have dnsNames for some reason
      validations:
      - rule: "!self.contains('*')"
        message: Wildcard certificates are not allowed.
    isCA: false
    subject:
      organizations:
        required: false
        values:
        - Cyclops-k8s
    usages:
    - client auth
    - digital signature
    - key encipherment
    - server auth
  constraints:
    # minDuration: 1h
    # maxDuration: 2160h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: iaas-wcooke-me
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: iaas-wcooke-me-cnpg-issuer
spec:
  allowed:
    commonName:
      value: "*"
    dnsNames:
      required: false
      values:
      - barman-cloud
    isCA: false
    usages:
    - client auth
    - server auth
  constraints:
    minDuration: 960h
    maxDuration: 960h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: cloudnative-pg-plugin-barman-cloud
    namespace:
      matchNames:
      - cloudnative-pg
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cyclops-k8s-issuer
spec:
  allowed:
    commonName:
      value: "*"
    isCA: true
  constraints:
    maxDuration: 8760h
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: cyclops-k8s-issuer
    namespace:
      matchNames:
      - cyclops-k8s
# ---
# # https://github.com/cert-manager/approver-policy/blob/main/docs/examples/default-deny-all.yaml

# apiVersion: policy.cert-manager.io/v1alpha1
