# https://cert-manager.io/docs/policy/approval/approver-policy/#allowed
# https://github.com/cert-manager/approver-policy/blob/main/docs/examples/all-options.yaml

apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: iaas-policy
spec:
  allowed:
    commonName:
      value: "*"
    dnsNames:
      required: false
      values:
      # Exposed domains from Kubernetes
      - "*.wcooke.me"
      # Kubernetes specific domains
      - "*.svc.cluster.local"
      - "*.svc.cluster"
      - "*.svc"
      # Cyclops Application specific domains
      - mattermost
      - keycloak
      - keycloak-service
      - prom-stack-kube-prometheus-operator
      - prom-stack-kube-prometheus-operator-webhook
      # Cluster application specific domains
      - "*.hubble-relay.cilium.io"
      - "*.default.hubble-grpc.cilium.io"
      - rook-ceph-rgw-ceph-objectstore.rook-ceph-cluster
      - rook-ceph-rgw-ceph-objectstore
      - "" # Harber does not have dnsNames for some reason
      validations:
      - rule: "!self.contains('*')"
        message: Wildcard certificates are not allowed.
    isCA: false
    usages:
    - client auth
    - server auth
  constraints:
    minDuration: 1h
    maxDuration: 2160h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: iaas-wcooke-me
# ---
# # https://github.com/cert-manager/approver-policy/blob/main/docs/examples/default-deny-all.yaml

# apiVersion: policy.cert-manager.io/v1alpha1
# kind: CertificateRequestPolicy
# metadata:
#   name: default-deny-all
# spec:
#   allowed:
#     dnsNames:
#       values: []
#       required: true
#   selector:
#     issuerRef: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-policy:iaas
rules:
- apiGroups:
  - policy.cert-manager.io
  resources:
  - certificaterequestpolicies
  resourceNames:
  - iaas-policy
  # - default-deny-all
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-policy:iaas-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-policy:iaas
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
