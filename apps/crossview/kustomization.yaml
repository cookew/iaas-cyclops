apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crossplane

resources:
- base/crossview-keycloak-client.yaml
- base/crossview-pg-cluster.yaml
- sealed-secrets/crossview-secrets.yaml

helmCharts:
- name: crossplane
  namespace: crossplane
  releaseName: crossplane
  repo: https://crossplane-contrib.github.io/crossview
  valuesFile: values.yaml
  version: 4.5.0
