apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crossview

resources:
- base/crossview-keycloak-client.yaml
- base/crossview-pg-cluster.yaml
- sealed-secrets/crossview-keycloak-client.yaml
- sealed-secrets/crossview-secrets.yaml

helmCharts:
- name: crossview
  namespace: crossview
  releaseName: crossview
  repo: https://crossplane-contrib.github.io/crossview
  valuesFile: values.yaml
  version: 4.5.0
