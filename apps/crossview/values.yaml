# https://github.com/crossplane-contrib/crossview/blob/main/helm/crossview/values.yaml

global:
  createNamespace: false

app:
  replicas: 2

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: iaas-wcooke-me
    forecastle.stakater.com/appName: Crossview
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: Kubernetes
    forecastle.stakater.com/icon: https://crossview.apps.iaas.wcooke.me/images/cross-view-logo-sidebar.svg
    forecastle.stakater.com/network-restricted: "true"
  hosts:
  - host: crossview.apps.iaas.wcooke.me
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: crossview-tls
    hosts:
    - crossview.apps.iaas.wcooke.me

database:
  enabled: false

config:
  database:
    enabled: true
    host: crossview-pg-cluster-rw
    port: 5432
    database: crossview
    username: crossview
  server:
    port: 3001
    cors:
      origin: https://crossview.apps.iaas.wcooke.me
      credentials: true
    session:
      cookie:
        secure: true
        httpOnly: true
        maxAge: 86400000

  sso:
    oidc:
      enabled: true
      issuer: https://keycloak.apps.iaas.wcooke.me/realms/iaas
      clientId: crossview
      # authorizationURL: https://keycloak.apps.iaas.wcooke.me/realms/iaas/protocol/openid-connect/auth
      # tokenURL: https://keycloak.apps.iaas.wcooke.me/realms/iaas/protocol/openid-connect/token
      # userInfoURL: https://keycloak.apps.iaas.wcooke.me/realms/iaas/protocol/openid-connect/userinfo
      callbackURL: https://crossview.apps.iaas.wcooke.me/api/auth/oidc/callback
      scope: openid profile email
      usernameAttribute: preferred_username
      emailAttribute: email
      firstNameAttribute: given_name
      lastNameAttribute: family_name

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

secrets:
  adminUsername:
    secretKeyRef:
      name: crossview-secrets
      key: admin-username
  adminPassword:
    secretKeyRef:
      name: crossview-secrets
      key: admin-password
  dbPassword:
    secretKeyRef:
      name: crossview-pg-cluster-app
      key: password
  sessionSecret:
    secretKeyRef:
      name: crossview-secrets
      key: session-secret
  OIDCClientSecret:
    secretKeyRef:
      name: crossview-keycloak-client
      key: client-secret

serviceAccount:
  create: true

rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

podAnnotations:
  reloader.stakater.com/auto: "true"
