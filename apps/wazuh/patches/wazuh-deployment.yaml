- op: add
  path: /spec/revisionHistoryLimit
  value: 0

- op: add
  path: /spec/template/spec/volumes/-
  value:
    configMap:
      defaultMode: 420
      name: ca-all
    name: ca

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    name: ca
    readOnly: true
    subPath: ca-certificates.crt
