apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # Feature gates are defined here
      # https://github.com/kubevirt/kubevirt/blob/main/pkg/virt-config/featuregate/active.go
      featureGates:
      - CPUManager
      - ExperimentalIgnitionSupport
      - HypervStrictCheck
      - Sidecar
      - HostDevices
      - Snapshot
      - HostDisk
      - UtilityVolumes
      - DownwardMetrics
      - Root
      - WorkloadEncryptionSEV
      - WorkloadEncryptionTDX
      - VSOCK
      - AlignCPUs
      - NodeRestriction
      - ImageVolume
      - IncrementalBackup
      - ExternalVMSnapshot
      - OfflineIncrementalBackup
      - EnableVirtioFsStorageVolumes
      - GPUsWithDRA
      - HostDevicesWithDRA
      - CPUsWithDRA
      - PCINUMAAwareTopology
      - NetworkDevicesWithDRA
      - DecentralizedLiveMigration
      - CrossClusterMigrationProxy
      - ObjectGraph
      - DeclarativeHotplugVolumes
      - PasstBinding
      - ConfigurableHypervisor
      - RebootPolicy
      - Template
      - ContainerPathVolumes
      - ReservedOverheadMemlock
      - OptOutRoleAggregation
      - MDevVGPULiveMigration
      - VGPULiveMigration
      - VMStatsCollector
      - OCIExport
      - Plugins
      - GraceIOVirtualization
      # - IOMMUFD
      - FirmwareAutoSelection
      - MigrationStallDetection
      - MigrationDowntimeTuning
      - CrossArchitectureVirtualization
      - PortRangesSpec
      - TLSGroupPreferences
      - SCSIMultiIOThread
      - ARM64SecureBoot
      - DeclarativeVMState
    # permittedHostDevices:
    #   usb:
    #   - resourceName: "zwave"
    #     selectors:
    #     - vendor: "0658"
    #       product: "0200"
    vmStateStorageClass: ceph-filesystem
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  monitorAccount: kube-prometheus-stack-prometheus
  monitorNamespace: kube-prometheus-stack
  serviceMonitorNamespace: kubevirt
  workloadUpdateStrategy: {}
