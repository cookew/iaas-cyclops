apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: kargo
spec:
  deletionPolicy: Delete
  forProvider:
    accessType: public
    baseUrl: /
    clientId: kargo
    # clientSecretSecretRef:
    #   key: client-secret
    #   name: kargo-keycloak-client
    #   namespace: kargo
    # directAccessGrantsEnabled: true
    name: Kargo
    pkceCodeChallengeMethod: S256
    realmIdRef:
      name: iaas
    rootUrl: https://kargo.apps.iaas.wcooke.me
    standardFlowEnabled: true
    validPostLogoutRedirectUris:
    - /
    validRedirectUris:
    - /*
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: client.keycloak.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: kargo-role-mapper
spec:
  forProvider:
    clientIdRef:
      name: kargo
    config:
      claim.name: groups
      client_id_for_role_mappings: kargo
      id.token.claim: "true"
      jsonType.label: String
      multivalued: "true"
    name: kargo-role-mapper
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    keycloak/realm: iaas
    keycloak/group-admins: ""
  name: kargo-admin
spec:
  deletionPolicy: Delete
  forProvider:
    clientIdRef:
      name: kargo
    name: kargo-admin
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: role.keycloak.crossplane.io/v1alpha1
