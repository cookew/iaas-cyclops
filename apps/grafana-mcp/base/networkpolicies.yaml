apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-mcp-to-grafana
spec:
  egress:
  - ports:
    - port: 80
      protocol: TCP
    from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: grafana
      podSelector:
        matchLabels:
          app.kubernetes.io/component: grafana
          app.kubernetes.io/instance: grafana
          app.kubernetes.io/name: grafana
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana-mcp
      app.kubernetes.io/instance: grafana-mcp
      app.kubernetes.io/name: grafana-mcp
  policyTypes:
  - Egress
