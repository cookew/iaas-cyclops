apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: pulp
spec:
  deletionPolicy: Delete
  forProvider:
    accessType: confidential
    baseUrl: /
    clientId: pulp
    clientSecretSecretRef:
      key: client-secret
      name: pulp-keycloak-client
      namespace: pulp
    # directAccessGrantsEnabled: true
    name: Pulp
    pkceCodeChallengeMethod: S256
    realmIdRef:
      name: iaas
    rootUrl: https://pulp.apps.iaas.wcooke.me
    standardFlowEnabled: true
    validPostLogoutRedirectUris:
    - /
    validRedirectUris:
    - /*
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: client.keycloak.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: pulp-role-mapper
spec:
  forProvider:
    clientIdRef:
      name: pulp
    config:
      claim.name: groups
      client_id_for_role_mappings: pulp
      id.token.claim: "true"
      jsonType.label: String
      multivalued: "true"
    name: pulp-role-mapper
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    keycloak/realm: iaas
    keycloak/group-admins: ""
  name: pulp-admin
spec:
  deletionPolicy: Delete
  forProvider:
    clientIdRef:
      name: pulp
    name: pulp-admin
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    keycloak/realm: iaas
  name: pulp-user
spec:
  deletionPolicy: Delete
  forProvider:
    clientIdRef:
      name: pulp
    name: pulp-user
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: pulp-admins
spec:
  deletionPolicy: Delete
  forProvider:
    name: pulp-admins
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: pulp-users
spec:
  deletionPolicy: Delete
  forProvider:
    name: pulp-users
    realmIdRef:
      name: iaas
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Roles
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: pulp-admin
spec:
  deletionPolicy: Delete
  forProvider:
    groupIdRef:
      name: pulp-admins
    realmIdRef:
      name: iaas
    roleIdsRefs:
    - name: pulp-admin
  providerConfigRef:
    name: keycloak-iaas
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Roles
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: pulp-user
spec:
  deletionPolicy: Delete
  forProvider:
    groupIdRef:
      name: pulp-users
    realmIdRef:
      name: iaas
    roleIdsRefs:
    - name: pulp-user
  providerConfigRef:
    name: keycloak-iaas
