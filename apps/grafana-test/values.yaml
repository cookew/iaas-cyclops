# https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml

admin:
  existingSecret: grafana-test-admin

extraSecretMounts:
- name: grafana-test-pg-cluster-app
  mountPath: /grafana-test-pg-cluster-app
  optional: false
  secretName: grafana-test-pg-cluster-app
  readOnly: true
- name: grafana-test-keycloak-client
  mountPath: /grafana-test-keycloak-client
  optional: false
  secretName: grafana-test-keycloak-client
  readOnly: true
- name: secret-key
  mountPath: /grafana-test-secret-key
  optional: false
  secretName: grafana-test-secret-key
  readOnly: true
- name: grafana-test-valkey-password
  mountPath: /grafana-test-valkey-password
  optional: false
  secretName: grafana-test-valkey-password
  readOnly: true

extraVolumeMounts:
- name: ca-certificates
  mountPath: /etc/ssl/certs

extraVolumes:
- name: ca-certificates
  configMap:
    name: ca-all

grafana.ini:
  alerting:
    enabled: false
  analytics:
    enabled: false
    check_for_plugin_updates: false
    check_for_updates: false
    feedback_links_enabled: false
    reporting_enabled: false
  auth:
    disable_login_form: true
    login_maximum_inactive_lifetime_duration: 15m
    signout_redirect_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fforecastle.apps.iaas.wcooke.me
  auth.anonymous:
    hide_version: true
  auth.basic:
    password_policy: true
  auth.generic_oauth:
    allow_assign_grafana_admin: true
    allow_sign_up: true
    api_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/userinfo
    auth_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/auth
    auto_login: true
    client_id: "$__file{/grafana-test-keycloak-client/client-id}"
    client_secret: "$__file{/grafana-test-keycloak-client/client-secret}"
    email_attribute_path: email
    enabled: true
    jwk_set_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/certs
    login_attribute_path: preferred_username
    name_attribute_path: name
    name: Keycloak
    # role_attribute_path: contains(resource_access.grafana.roles[*], 'grafana-server-admin') && 'GrafanaAdmin' || contains(resource_access.grafana.roles[*], 'grafana-admin') && 'Admin' || contains(resource_access.grafana.roles[*], 'grafana-editor') && 'Editor' || contains(resource_access.grafana.roles[*], 'grafana-viewer') && 'Viewer'
    role_attribute_path: Editor
    role_attribute_strict: true
    scopes: openid email profile offline_access roles
    signout_redirect_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fforecastle.apps.iaas.wcooke.me
    # tls_client_ca: /ca-bundle/ca-bundle.pem
    token_url: https://keycloak.apps.iaas.wcooke.me/realms/test/protocol/openid-connect/token
    use_pkce: true
    use_refresh_token: true
    validate_id_token: true
  auth.security:
    protected_roles: server_admins
  database:
    host: "$__file{/grafana-test-pg-cluster-app/host}:$__file{/grafana-test-pg-cluster-app/port}"
    name: "$__file{/grafana-test-pg-cluster-app/dbname}"
    password: "$__file{/grafana-test-pg-cluster-app/password}"
    type: postgres
    user: "$__file{/grafana-test-pg-cluster-app/user}"
  date_formats:
    default_timezone: browser
  feature_toggles:
    grafanaAdvisor: true
    provisioning: true
    kubernetesClientDashboardsFolders: true
    kubernetesDashboards: true # use k8s from browser
    # If you want easy kubectl setup development mode
    grafanaAPIServerEnsureKubectlAccess: true
  grafana_net:
    url: https://grafana.net
  help:
    enabled: false
  live:
    ha_engine: redis
    ha_engine_address: valkey-test:6379
    ha_engine_password: "$__file{/grafana-test-valkey-password/REDIS_PASSWORD}"
  news:
    news_feed_enabled: false
  # plugins:
  #   plugin_admin_enabled: false
  security:
    allow_embedding: true
    content_security_policy: true
    cookie_samesite: strict
    cookie_secure: true
    # csrf_always_check:
    # csrf_trusted_origins:
    disable_gravatar: true
    strict_transport_security: true
    strict_transport_security_preload: true
    secret_key: "$__file{/grafana-test-secret-key/secret_key}"
  server:
    # Setting enforce_domain: true breaks the sidecars that update dashboards and datasources.
    # enforce_domain: true
    root_url: https://grafana-test.apps.iaas.wcooke.me
    router_logging: true
    min_tls_version: "1.3"
  snapshots:
    enabled: false
  support_bundles:
    enabled: false
  unified_alerting:
    enabled: true
    ha_advertise_address: ${POD_IP}:9094
    ha_listen_address: ${POD_IP}:9094
    ha_peers: "{{ .Release.Name }}-headless:9094"
    ha_redis_address: valkey-test:6379
    ha_redis_password: "$__file{/grafana-test-valkey-password/REDIS_PASSWORD}"
    rule_version_record_limit: "5"

headlessService: true

ingress:
  annotations:
    cert-manager.io/cluster-issuer: iaas-wcooke-me
    forecastle.stakater.com/appName: Grafana Test
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: Observability
    forecastle.stakater.com/icon: https://grafana-test.apps.iaas.wcooke.me/public/img/grafana_icon.svg
    forecastle.stakater.com/network-restricted: "true"
  enabled: true
  hosts:
  - grafana-test.apps.iaas.wcooke.me
  ingressClassName: cilium
  tls:
  - hosts:
    - grafana-test.apps.iaas.wcooke.me
    secretName: grafana-ingress-tls

initChownData:
  resources:
    limits:
      cpu: 100m
      memory: 32Mi
    requests:
      cpu: 50m
      memory: 16Mi

livenessProbe:
  failureThreshold: 10
  httpGet:
    path: /api/health
    port: grafana
    httpHeaders:
    - name: Host
      value: grafana-test.apps.iaas.wcooke.me
  initialDelaySeconds: 60
  timeoutSeconds: 30

plugins:
- grafana-github-datasource
- grafana-llm-app
- grafana-lokioperational-app

replicas: 2

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 1Gi

revisionHistoryLimit: 0

serviceMonitorSelector:
  enabled: false

sidecar:
  logLevel: WARN
  resources:
    limits:
      cpu: 100m
      memory: 150Mi
    requests:
      cpu: 10m
      memory: 75Mi
  alerts:
    enabled: false
  dashboards:
    enabled: false
  datasources:
    enabled: false
  notifiers:
    enabled: false
  plugins:
    enabled: false
