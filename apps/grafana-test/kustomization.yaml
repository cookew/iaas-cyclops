apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana-test

resources:
- base/grafana-test-pg-cluster.yaml
- sealed-secrets/grafana-test-admin.yaml
- sealed-secrets/grafana-test-keycloak-client.yaml
- sealed-secrets/grafana-test-secret-key.yaml
- sealed-secrets/grafana-test-valkey-password.yaml

helmCharts:
- name: grafana
  namespace: grafana-test
  releaseName: grafana-test
  repo: https://grafana-community.github.io/helm-charts
  valuesFile: values.yaml
  version: 13.2.4
- name: valkey
  namespace: grafana-test
  releaseName: valkey-test
  repo: https://valkey.io/valkey-helm
  valuesFile: valkey-values.yaml
  version: 0.12.0
