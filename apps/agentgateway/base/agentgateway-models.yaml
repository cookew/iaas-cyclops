
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
spec:
  hostnames:
  - ai.wcooke.me
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: agentgateway-proxy
    namespace: agentgateway-system
    sectionName: http
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ollama
      namespace: agentgateway-system
      weight: 1
