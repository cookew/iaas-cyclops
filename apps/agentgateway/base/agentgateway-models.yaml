---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama
spec:
  ai:
    provider:
      host: ollama.ollama.svc
      openai:
        model: qwen3.5:4b
      path: /v1/chat/completions
      # pathPrefix: /v1
      port: 11434
