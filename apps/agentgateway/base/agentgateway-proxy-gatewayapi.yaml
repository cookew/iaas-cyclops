apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
spec:
  addresses:
  - type: IPAddress
    value: 10.42.41.200
  allowedListeners:
    namespaces:
      from: Same
  gatewayClassName: agentgateway
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: dummy
    port: 11111
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  annotations:
    cert-manager.io/cluster-issuer: iaas-wcooke-me
    cert-manager.io/duration: 720h
  name: agentgateway-proxy
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
    namespace: agentgateway-system
  listeners:
  - allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      namespaces:
        from: Same
    hostname: ai.wcooke.me
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: agentgateway-proxy-gwapi
      mode: Terminate
  - allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      namespaces:
        from: Same
    hostname: ai.wcooke.me
    name: http
    port: 80
    protocol: HTTP
