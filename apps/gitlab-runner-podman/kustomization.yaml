apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: gitlab-runner-podman

resources:
- base/podman.yaml
- sealed-secrets/gitlab-runner-token.yaml

# https://gitlab.com/gitlab-org/charts/gitlab-runner/-/blob/main/Chart.yaml?ref_type=heads
helmCharts:
- name: gitlab-runner
  namespace: gitlab-runner-podman
  releaseName: gitlab-runner-podman
  repo: https://charts.gitlab.io
  version: 0.92.0
  valuesFile: values.yaml
