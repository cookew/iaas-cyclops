apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: rpm
    app.kubernetes.io/name: repo-sync-iso
    app.kubernetes.io/part-of: repo-sync
  name: repo-sync-iso
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "0 3 * * 0"  # Runs every sunday at 3 AM
  timeZone: "America/Denver"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: iso
            app.kubernetes.io/name: repo-sync-iso
            app.kubernetes.io/part-of: repo-sync
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              #!/bin/bash

              set -euo pipefail

              ARCH="x86_64"
              # ISO_FLAVOR="minimal" # Options: minimal, dvd, boot
              DEST_DIR="/repo-mirror/iso"
              TEMP_DIR="/repo-mirror/iso/.temp"
              MAJOR_VERSIONS=(
              "8,dvd1"
              "9,dvd"
              "10,dvd1"
              )
              BASE_URL="https://download.rockylinux.org/pub/rocky"
              DIST_FLAVOR_LOWER="rocky"
              DIST_FLAVOR_CAPITALIZED="Rocky"

              for c in curl bsdtar sha256sum grep head find sed
              do
                if ! command -v "${c}" >/dev/null 2>&1
                then
                  echo "${c} is not installed" >&2
                  exit 1
                fi
              done

              if [ ! -d "${DEST_DIR}" ]
              then
                mkdir -p "${DEST_DIR}"
              fi

              if [ ! -d "${TEMP_DIR}" ]
              then
                mkdir -p "${TEMP_DIR}"
              fi

              echo "  [INFO] Creating temporary subdirectory under ${TEMP_DIR}"
              TEMP_SUBDIR=$(mktemp -d "${TEMP_DIR}/tmp.XXXXXX")
              trap 'rm -rf "${TEMP_SUBDIR}"' EXIT

              for ver in "${MAJOR_VERSIONS[@]}"
              do
                IFS=',' read -r MAJOR_VERSION ISO_FLAVOR <<< "${ver}"
                DIR_URL="${BASE_URL}/${MAJOR_VERSION}/isos/${ARCH}"
                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Checking ..."

                WORKING_DIR="${TEMP_SUBDIR}/${DIST_FLAVOR_LOWER}/${MAJOR_VERSION}"
                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Preparing working directory ${WORKING_DIR}"
                mkdir -p "${WORKING_DIR}"

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Fetching CHECKSUM file"
                curl -sL -o "${WORKING_DIR}/CHECKSUM-${MAJOR_VERSION}" "${DIR_URL}/CHECKSUM"

                # Fetch directory listing and extract the ISO filename
                # Matches patterns like ${DIST_FLAVOR_CAPITALIZED}-9.9-x86_64-minimal.iso or ${DIST_FLAVOR_CAPITALIZED}-10.3-x86_64-minimal.iso
                unset REMOTE_ISO
                REMOTE_ISO=$(curl -sL "${DIR_URL}/" \
                  | grep -oE "${DIST_FLAVOR_CAPITALIZED}-${MAJOR_VERSION}\.[0-9]+-${ARCH}-${ISO_FLAVOR}\.iso" \
                  | head -n 1 || true)

                if [[ -z "${REMOTE_ISO}" ]]
                then
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] ERROR: Could not determine latest ISO filename from ${DIR_URL}/"
                  continue
                fi

                if ! grep -q "${REMOTE_ISO}" "${WORKING_DIR}/CHECKSUM-${MAJOR_VERSION}"
                then
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] ERROR: Checksum entry not found for ${REMOTE_ISO}"
                  continue
                else
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Checksum entry found for ${REMOTE_ISO}"
                  mv "${WORKING_DIR}/CHECKSUM-${MAJOR_VERSION}" "${DEST_DIR}/${DIST_FLAVOR_LOWER}/CHECKSUM-${MAJOR_VERSION}"
                fi

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Latest online: ${REMOTE_ISO}"

                # Check if the local filename matches the remote checksum
                if [ -f "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${REMOTE_ISO}" ]
                then
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Verifying local ISO against checksum..."
                  if echo $(grep -v '^#' "${DEST_DIR}/${DIST_FLAVOR_LOWER}/CHECKSUM-${MAJOR_VERSION}" | grep "${REMOTE_ISO}" | sed "s@${REMOTE_ISO}.*@${DEST_DIR}/${DIST_FLAVOR_LOWER}/&@g") | sha256sum -c -
                  #if grep "${REMOTE_ISO}" "${DEST_DIR}/${DIST_FLAVOR_LOWER}/CHECKSUM-${MAJOR_VERSION}" | sha256sum -c -
                  then
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Local ISO verification succeeded."
                  else
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Local ISO verification failed."
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Removing local ISO."
                    rm -f "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${REMOTE_ISO}"
                  fi
                fi

                if [ ! -f "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${REMOTE_ISO}" ]
                then
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Local ISO not found. Fetching ${REMOTE_ISO}..."
                  curl -fL -o "${WORKING_DIR}/${REMOTE_ISO}" "${DIR_URL}/${REMOTE_ISO}"
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Completed fetching ${REMOTE_ISO}."

                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Verifying local ISO against checksum..."
                  if echo $(grep -v '^#' "${DEST_DIR}/${DIST_FLAVOR_LOWER}/CHECKSUM-${MAJOR_VERSION}" | grep "${REMOTE_ISO}" | sed "s@${REMOTE_ISO}.*@${WORKING_DIR}/&@g") | sha256sum -c -
                  then
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Local ISO verification succeeded."
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Moving verified ISO to destination."
                    mv "${WORKING_DIR}/${REMOTE_ISO}" "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${REMOTE_ISO}"
                  else
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Local ISO verification failed."
                    echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Removing local ISO."
                    rm -f "${WORKING_DIR}/${REMOTE_ISO}"
                    continue
                  fi
                fi

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Preparing directory ${WORKING_DIR}/${MAJOR_VERSION} for extraction..."
                mkdir -p "${WORKING_DIR}/${MAJOR_VERSION}"

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Extracting ${REMOTE_ISO} to ${WORKING_DIR}/${MAJOR_VERSION}..."
                bsdtar -xf "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${REMOTE_ISO}" -C "${WORKING_DIR}/${MAJOR_VERSION}"

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Creating symlinks for AppStream and BaseOS..."
                rm -rf "${WORKING_DIR}/${MAJOR_VERSION}/AppStream"
                ln -s ../../../rpm/${DIST_FLAVOR_LOWER}-${MAJOR_VERSION}-x86_64-appstream/ "${WORKING_DIR}/${MAJOR_VERSION}/AppStream"
                rm -rf "${WORKING_DIR}/${MAJOR_VERSION}/BaseOS"
                ln -s ../../../rpm/${DIST_FLAVOR_LOWER}-${MAJOR_VERSION}-x86_64-baseos/ "${WORKING_DIR}/${MAJOR_VERSION}/BaseOS"

                if [ -d "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${MAJOR_VERSION}" ]
                then
                  echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Removing existing directory ${DEST_DIR}/${DIST_FLAVOR_LOWER}/${MAJOR_VERSION}..."
                  rm -rf "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${MAJOR_VERSION}"
                fi

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Moving files to final location..."
                mv "${WORKING_DIR}/${MAJOR_VERSION}" "${DEST_DIR}/${DIST_FLAVOR_LOWER}/${MAJOR_VERSION}"

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Removing older ISOs..."
                find "${DEST_DIR}/${DIST_FLAVOR_LOWER}" -maxdepth 1 -name "${DIST_FLAVOR_CAPITALIZED}-${MAJOR_VERSION}.*-${ARCH}-${ISO_FLAVOR}.iso" ! -name "${REMOTE_ISO}" -delete

                echo "[${DIST_FLAVOR_CAPITALIZED} ${MAJOR_VERSION} ${ARCH}] INFO: Sync complete."
              done
            command:
            - /bin/bash
            - -c
            image: registry.wcooke.me:5000/repo-sync-iso/repo-sync-iso:1
            imagePullPolicy: Always
            # livenessProbe:
            #   httpGet:
            #     path: /
            #     port: 8080
            #   initialDelaySeconds: 60
            #   periodSeconds: 10
            name: repo-sync-iso
            # ports:
            # - containerPort: 8080
            #   name: http
            #   protocol: TCP
            # readinessProbe:
            #   httpGet:
            #     path: /
            #     port: 8080
            #   initialDelaySeconds: 30
            #   periodSeconds: 10
            #   failureThreshold: 20
            resources:
              limits:
                cpu: 4000m
                memory: 1Gi
              requests:
                cpu: 1000m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /repo-mirror
              name: repo-mirror
              readOnly: false
            # - mountPath: /var/tmp
            #   name: var-tmp
            #   readOnly: false
          nodeSelector:
            kubernetes.io/os: linux
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: repo-mirror
            persistentVolumeClaim:
              claimName: repo-sync-repo-mirror
          # - ephemeral:
          #     volumeClaimTemplate:
          #       metadata:
          #         labels:
          #           type: my-frontend-volume
          #       spec:
          #         accessModes:
          #         - ReadWriteOnce
          #         resources:
          #           requests:
          #             storage: 32Gi
          #         storageClassName: ceph-filesystem
          #   name: var-tmp
