    app.kubernetes.io/component: repo-sync
    app.kubernetes.io/name: repo-sync-repo-mirror
    app.kubernetes.io/part-of: repo-sync
  name: repo-sync-repo-mirror
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 400Gi
  storageClassName: ceph-filesystem
  volumeMode: Filesystem
