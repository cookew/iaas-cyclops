apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: nginx
    app.kubernetes.io/name: repo-sync-nginx
    app.kubernetes.io/part-of: repo-sync
  name: repo-sync-nginx
data:
  default.conf: |
    server {
      default_type  text/plain;
      listen        8080;
      listen        [::]:8080;
      server_name   localhost;
      location / {
        # index                 index.html index.htm;
        autoindex             on;
        autoindex_exact_size  on;
        autoindex_format      html;
        autoindex_localtime   on;
        root                  /repo-mirror;

      }
      location = /healthz {
        access_log  off;
        add_header  Content-Type text/plain;
        return      200 "healthy\n";
      }
    }
