kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  annotations:
    cert-manager.io/cluster-issuer: iaas-wcooke-me
    forecastle.stakater.com/appName: Repo
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: Apps
    # forecastle.stakater.com/icon: https://repo.apps.iaas.wcooke.me/logo.png
    forecastle.stakater.com/network-restricted: "false"
  name: repo-sync-nginx
spec:
  ingressClassName: cilium
  rules:
  - host: repo.apps.iaas.wcooke.me
    http:
      paths:
      - backend:
          service:
            name: repo-sync-nginx
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - repo.apps.iaas.wcooke.me
    secretName: repo-sync-nginx-ingress
