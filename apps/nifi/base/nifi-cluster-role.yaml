apiVersion: v1
kind: ServiceAccount
metadata:
  name: nifi-cluster
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi-cluster
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - "*"
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nifi-cluster
subjects:
- kind: ServiceAccount
  name: nifi-cluster
  namespace: nifi
