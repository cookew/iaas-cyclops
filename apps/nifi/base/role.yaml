kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifikop
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - "*"
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifikop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nifikop
subjects:
  - kind: ServiceAccount
    name: nifikop
    namespace: nifi
