kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifikop
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - services/finalizers
  - endpoints
  - persistentvolumeclaims
  - events
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - get
  - create
- apiGroups:
  - apps
  resourceNames:
  - nifikop
  resources:
  - deployments/finalizers
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  verbs:
  - get
- apiGroups:
  - nifi.konpyutaika.com
  resources:
  - "nifiusers"
  - "nifiusergroups"
  - "nificlusters"
  - "nifidataflows"
  - "nifiregistryclients"
  - "nifiparametercontexts"
  - "nifinodegroupautoscalers"
  - "nificonnections"
  - "nifiresources"
  - "nifiusers/finalizers"
  - "nificlusters/finalizers"
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  - deletecollection
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - clusterissuers
  - certificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nifi.konpyutaika.com
  resources:
  - nifiusers/status
  - nifiusergroups/status
  - nificlusters/status
  - nifidataflows/status
  - nifiregistryclients/status
  - nifiparametercontexts/status
  - nifinodegroupautoscalers/status
  - nificonnections/status
  - nifiresources/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - create
    - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifikop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nifikop
subjects:
  - kind: ServiceAccount
    name: nifikop
    namespace: nifi
