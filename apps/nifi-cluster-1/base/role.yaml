kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - "*"
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nifi
subjects:
  - kind: ServiceAccount
    name: default
    namespace: nifi
