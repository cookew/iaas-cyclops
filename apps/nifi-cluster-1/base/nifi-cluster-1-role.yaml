kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi-cluster-1
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nifi-cluster-1
subjects:
  - kind: ServiceAccount
    name: default
    namespace: nifi-cluster-1
roleRef:
  kind: Role
  name: nifi-cluster-1
  apiGroup: rbac.authorization.k8s.io
