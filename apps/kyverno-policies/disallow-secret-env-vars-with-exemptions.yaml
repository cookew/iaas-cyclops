apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-secret-env-vars-with-exemptions
  annotations:
    policies.kyverno.io/title: Disallow Secrets as Environment Variables with Exemptions
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-secret-env-vars
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          - DaemonSet
          - Job
          - CronJob
    exclude:
      any:
      # Exempt namespaces with a specific label (e.g., exempt-secrets-env: "true")
      - clusterScopes:
          namespaces:
            matchExpressions:
            - key: exempt-secrets-env
              operator: In
              values:
              - "true"
      # Exempt if pod name is present in a pod/resource label list (e.g., label 'allowed-pod-list' containing a comma-separated list or exact match)
      - resources:
          selector:
            matchExpressions:
            - key: allowed-pod-list
              operator: Exists
    preconditions:
      any:
      # Ensure we evaluate the pod template specifications
      - key: "{{ request.operation }}"
        operator: AnyIn
        nuts:
        - CREATE
        - UPDATE
    validate:
      message: "Secrets cannot be mounted as environment variables, unless whitelisted by regex or exemptions."
      # JMESPath-based or pattern validation logic checking containers / initContainers
      pattern:
        spec:
          =(template):
            spec:
              containers:
              - =(env):
                - X(valueFrom):
                    =(secretKeyRef): "*"
              # Whitelist env variable names matching regex like USERNAME or FSID
              # Note: Kyverno preconditions/pattern matching or CEL can inspect env name strings
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-secret-env-vars-with-exemptions
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-secret-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - clusterScopes:
              namespaces:
                matchExpressions:
                  - key: exempt-secrets-env
                    operator: In
                    values: ["true"]
      validate:
        message: "Secrets cannot be mounted as environment variables unless they are whitelisted (e.g., USERNAME, FSID, MY_SAFE_VAR)."
        foreach:
          # Iterate over all containers to check their environment variables
          - list: "request.object.spec.template.spec.containers"
            deny:
              conditions:
                all:
                  # 1. Check if the environment variable comes from a Secret
                  - key: "{{ element.env[].valueFrom.secretKeyRef | length(@) }}"
                    operator: GreaterThan
                    value: 0

                  # 2. Apply the Regex Whitelist here
                  # This rule DENIES the pod IF the env name does NOT match our regex.
                  - key: "{{ element.env[].name }}"
                    operator: NotRegexMatch
                    # -----------------------------------------------------------
                    # ADD YOUR STRINGS HERE:
                    # Separate each allowed phrase or exact string with a '|' pipe.
                    # -----------------------------------------------------------
                    value: ".*(USERNAME|FSID|MY_SAFE_VAR|API_TOKEN).*"
