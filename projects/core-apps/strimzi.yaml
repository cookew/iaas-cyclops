apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: strimzi
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: strimzi
  # ignoreDifferences:
  # - group: apiextensions.k8s.io
  #   kind: CustomResourceDefinition
  #   jqPathExpressions:
  #   - .spec.versions[] | select(.name == "v1alpha1")
  project: core
  revisionHistoryLimit: 0
  source:
    helm:
      skipCrds: false
      valueFiles:
      - $config/values.yaml
    repoURL: quay.io/strimzi-helm/strimzi-kafka-operator
    targetRevision: 1.1.0
  sources:
  - path: apps/strimzi
    ref: config
    repoURL: git@github.com:cookew/iaas-cyclops.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=false
    - ServerSideApply=true
