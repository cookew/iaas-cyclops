apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: nifi
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: nifi
  project: core
  revisionHistoryLimit: 0
  sources:
  - chart: nifikop
    helm:
      skipCrds: false
      valueFiles:
      - $config/apps/nifi/values.yaml
    repoURL: ghcr.io/konpyutaika/helm-charts
    targetRevision: 1.17.0
  - ref: config
    repoURL: git@github.com:cookew/iaas-cyclops.git
    targetRevision: main
  - kustomize: {}
    path: apps/nifi
    repoURL: git@github.com:cookew/iaas-cyclops.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=false
    - ServerSideApply=true
