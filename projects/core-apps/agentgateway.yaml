apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: agentgateway
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: agentgateway
  project: core
  revisionHistoryLimit: 0
  sources:
  - chart: agentgateway
    helm:
      skipCrds: false
      valueFiles:
      - $config/apps/agentgateway/values.yaml
    repoURL: cr.agentgateway.dev/charts/agentgateway-crds
    targetRevision: v1.6.0
  - ref: config
    repoURL: git@github.com:cookew/iaas-cyclops.git
    targetRevision: main
  - kustomize: {}
    path: apps/agentgateway
    repoURL: git@github.com:cookew/iaas-cyclops.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=false
    - ServerSideApply=true
